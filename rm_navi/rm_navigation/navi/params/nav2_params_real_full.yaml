controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 8.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      default_critic_namespaces:
      - dwb_critics
      - tcpa_dcpa_critic
      debug_trajectory_details: true
      min_vel_x: -0.8
      min_vel_y: -0.8
      max_vel_x: 0.8
      max_vel_y: 0.8
      max_vel_theta: 0.0
      min_speed_xy: 0.0
      max_speed_xy: 1.1
      min_speed_theta: 0.0
      acc_lim_x: 1.2
      acc_lim_y: 1.2
      acc_lim_theta: 1.0
      decel_lim_x: -1.2
      decel_lim_y: -1.2
      decel_lim_theta: -1.0
      vx_samples: 24
      vy_samples: 24
      vtheta_samples: 1
      sim_time: 0.45
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: false
      stateful: true
      critics:
      - Oscillation
      - BaseObstacle
      - TCPADCPA
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.18
      PathAlign.scale: 0.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 28.0
      GoalDist.scale: 16.0
      RotateToGoal.scale: 0.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      TCPADCPA.plugin: tcpa_dcpa_critic::TCPADCPACritic
      TCPADCPA.scale: 10.0
      TCPADCPA.tau_safe: 2.0
      TCPADCPA.sigma_safe: 0.8
      TCPADCPA.tracked_topic: /tracked_obstacles
      TCPADCPA.max_obstacle_age: 0.5
      TCPADCPA.min_obstacle_speed: 0.05
      TCPADCPA.hesitation_speed_threshold: 0.25
      TCPADCPA.hesitation_penalty_scale: 2.0
      TCPADCPA.urgency_tcpa_threshold: 1.2
      TCPADCPA.urgency_dcpa_threshold: 1.2
      TCPADCPA.lateral_escape_penalty_scale: 3.5
      TCPADCPA.lateral_escape_speed_threshold: 0.45
      TCPADCPA.lateral_escape_ratio: 1.15
      TCPADCPA.goal_progress_penalty_scale: 2.0
      TCPADCPA.goal_progress_speed_threshold: 0.25
      TCPADCPA.escape_alignment_penalty_scale: 2.8
      TCPADCPA.escape_alignment_speed_threshold: 0.45
      TCPADCPA.escape_lateral_weight: 1.8
      TCPADCPA.rear_passing_penalty_scale: 4.0
      TCPADCPA.crossing_front_min_forward_distance: 0.35
      TCPADCPA.crossing_front_max_lateral_offset: 1.4
      TCPADCPA.crossing_obstacle_lateral_speed_threshold: 0.18
      TCPADCPA.crossing_obstacle_lateral_dominance_ratio: 1.05
      TCPADCPA.co_motion_relief_scale: 0.65
      TCPADCPA.co_motion_relief_min_alignment: 0.7
      TCPADCPA.co_motion_relief_max_relative_speed: 0.75
      TCPADCPA.co_motion_relief_min_multiplier: 0.4
      TCPADCPA.swept_corridor_penalty_scale: 3.2
      TCPADCPA.swept_corridor_half_width: 0.85
      TCPADCPA.rear_tail_margin: 0.25
      TCPADCPA.latency_stats_enabled: true
      TCPADCPA.latency_report_interval: 20
      TCPADCPA.direction_flip_penalty_scale: 1.5
      TCPADCPA.direction_flip_speed_threshold: 0.03
      TCPADCPA.axis_commitment_penalty_scale: 2.2
      TCPADCPA.axis_commitment_speed_threshold: 0.08
      TCPADCPA.side_escape_activation_tcpa: 1.25
      TCPADCPA.side_escape_activation_dcpa: 0.95
      TCPADCPA.side_escape_lateral_speed_threshold: 0.15
      TCPADCPA.side_escape_forward_band: 0.95
      TCPADCPA.side_escape_nominal_speed: 0.55
      TCPADCPA.side_escape_goal_bias: 0.12
      TCPADCPA.side_escape_switch_margin: 0.18
      TCPADCPA.side_escape_hold_time: 0.45
      TCPADCPA.side_escape_commitment_penalty_scale: 3.6
      TCPADCPA.side_escape_low_speed_penalty_scale: 2.0
      TCPADCPA.side_escape_longitudinal_speed_threshold: 0.25
      TCPADCPA.close_front_blend_distance: 1.0
      TCPADCPA.close_front_blend_tcpa: 0.9
      TCPADCPA.close_front_lateral_speed_threshold: 0.18
      TCPADCPA.close_front_lateral_preference_scale: 2.4
      TCPADCPA.close_front_same_side_penalty_scale: 3.2
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      transform_tolerance: 0.3
      width: 5.0
      height: 5.0
      resolution: 0.05
      footprint: '[[0.275, 0.225], [0.275, -0.225], [-0.275, -0.225], [-0.275, 0.225]]'
      footprint_padding: 0.01
      robot_radius: 0.36
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: livox_frame
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: true
      always_send_full_costmap: true
  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.3
      footprint: '[[0.275, 0.225], [0.275, -0.225], [-0.275, -0.225], [-0.275, 0.225]]'
      footprint_padding: 0.01
      robot_radius: 0.36
      resolution: 0.1
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: livox_frame
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true
  global_costmap_client:
    ros__parameters:
      use_sim_time: false
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false
map_server:
  ros__parameters:
